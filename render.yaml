services:
  - type: web
    name: sniffer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: env PYTHONPATH=src gunicorn src.app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FLASK_DEBUG
        value: "false"
      - key: RENDER
        value: "true"
