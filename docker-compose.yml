# Sniffer — local compose (app + pipeline)
# ponytail: no K8s needed; compose proves reproducibility for <5 services
services:
  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - HF_DATASET=${HF_DATASET:-}
      - SNIFFER_MINIMAL=0
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # run pipeline manually: docker compose run --rm pipeline
  pipeline:
    build: .
    entrypoint: ["python", "src/pipeline/run.py"]
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=${DATABASE_URL:-}
      - HF_DATASET=${HF_DATASET:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
