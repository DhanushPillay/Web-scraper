name: Scrape and Process News

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:      # Allow manual triggering

# Prevent a scheduled run and a manually dispatched run from competing to
# initialize the database or scrape the same feeds at the same time.
concurrency:
  group: scrape-and-process-news
  cancel-in-progress: false

jobs:
  scrape_and_process:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-actions.txt
        
    - name: Run Scraper and NLP Processor
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python scripts/github_scrape.py
