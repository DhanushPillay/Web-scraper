name: Lakehouse Pipeline & Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC (07:30 IST) — 100% Free on Public Repo
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest Suite
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v

  lakehouse-pipeline:
    name: Execute Medallion Lakehouse Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies & PySpark
        run: |
          pip install -r requirements.txt
          pip install pyspark==3.5.1 pyarrow duckdb pandas pyyaml

      - name: Download NLTK Tokenizers
        run: |
          python -c "import nltk; [nltk.download(r, quiet=True) for r in ['punkt', 'punkt_tab', 'vader_lexicon', 'stopwords']]"

      - name: Execute Lakehouse Pipeline (Bronze -> Silver -> Spark Gold)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          python src/pipeline/run.py

      - name: Upload Gold Analytical Marts
        uses: actions/upload-artifact@v4
        with:
          name: gold-analytics-marts-${{ github.run_id }}
          path: data/gold/
          retention-days: 14

      - name: Upload Data Quality Telemetry
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-logs-${{ github.run_id }}
          path: |
            data/logs/
            data/quarantine/
          retention-days: 14
